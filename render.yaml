services:
  - type: web
    name: oybit-api
    env: python
    buildCommand: "pip install -r requirements.txt && playwright install chromium --with-deps && cd backend/render_engine/templates/video && npm install"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: PYTHONIOENCODING
        value: utf-8

  - type: worker
    name: oybit-scheduler
    env: python
    startCommand: "python workers/scheduler_worker.py"

  - type: worker
    name: oybit-mirofish
    env: python
    startCommand: "python workers/mirofish_worker.py"

  - type: worker
    name: oybit-analytics
    env: python
    startCommand: "python workers/analytics_worker.py"

  - type: worker
    name: oybit-feedback
    env: python
    startCommand: "python workers/feedback_worker.py"

  - type: worker
    name: oybit-trends
    env: python
    startCommand: "python workers/trend_worker.py"

  - type: worker
    name: oybit-token-refresher
    env: python
    startCommand: "python workers/token_refresher.py"

  - type: worker
    name: oybit-keepalive
    env: python
    startCommand: "python workers/health_pinger.py"
