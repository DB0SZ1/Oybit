<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1080px; height: 1080px;
    font-family: 'Space Grotesk', sans-serif;
    padding: 0;
    background: #f5f0eb;
    color: #111;
    position: relative;
    overflow: hidden;
  }

  /* ── Border Frame ── */
  .border-frame {
    position: absolute;
    top: 20px; left: 20px; right: 20px; bottom: 20px;
    border: 3px solid #111;
    z-index: 1;
  }

  /* ── Content ── */
  .content {
    position: relative; z-index: 10;
    padding: 80px;
    display: flex; flex-direction: column;
    justify-content: center;
    height: 100%;
  }

  /* ── Slide Counter ── */
  .slide-counter {
    position: absolute; top: 44px; right: 50px; z-index: 10;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px; font-weight: 600;
    color: #111;
    letter-spacing: 0;
  }

  /* ── Corner Labels ── */
  .corner-tl {
    position: absolute; top: 40px; left: 50px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px; font-weight: 500;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 3px;
    z-index: 10;
  }

  /* ── Tag ── */
  .tag {
    display: inline-block;
    padding: 8px 18px;
    background: #111;
    color: #f5f0eb;
    font-size: 11px; font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 3px;
    margin-bottom: 32px;
  }

  /* ── Headline ── */
  .headline {
    font-size: 52px; font-weight: 700;
    line-height: 1.08;
    color: #111;
    margin-bottom: 28px;
    letter-spacing: -1px;
    max-width: 800px;
    text-transform: uppercase;
  }

  /* ── Heavy Rule ── */
  .heavy-rule {
    width: 100%; height: 3px;
    background: #111;
    margin: 24px 0;
  }

  /* ── Body ── */
  .body-text {
    font-size: 21px; line-height: 1.7;
    color: #555;
    max-width: 780px;
    font-weight: 400;
  }

  /* ── Numbered Point ── */
  .numbered {
    display: flex; align-items: flex-start; gap: 20px;
    margin-top: 16px;
  }
  .number {
    font-family: 'JetBrains Mono', monospace;
    font-size: 40px; font-weight: 700;
    color: #111;
    line-height: 1;
  }
  .number-text {
    font-size: 19px; line-height: 1.6;
    color: #444;
    padding-top: 8px;
  }

  /* ── Footer ── */
  .footer {
    position: absolute;
    bottom: 40px; left: 50px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px; font-weight: 500;
    color: #111;
    z-index: 10;
    display: flex; align-items: center; gap: 20px;
  }
  .footer-bar {
    width: 40px; height: 2px; background: #111;
  }

  /* ── Highlight Block ── */
  .highlight-block {
    background: #111;
    color: #f5f0eb;
    padding: 28px 32px;
    margin-top: 28px;
    font-size: 18px;
    line-height: 1.6;
    font-weight: 500;
  }

  /* ── CTA Variant ── */
  .is-cta .content {
    align-items: center; text-align: center;
  }
  .is-cta .headline {
    text-align: center;
  }
  .is-cta .body-text {
    text-align: center; margin: 0 auto;
  }
  .cta-brutalist {
    margin-top: 32px;
    padding: 18px 48px;
    background: #111;
    color: #f5f0eb;
    font-size: 16px; font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 3px;
    border: 3px solid #111;
  }
</style>
</head>
<body class="{% if slide_number == total_slides %}is-cta{% endif %}">
  <div class="border-frame"></div>

  <div class="corner-tl">{{ topic_pillar | default("INSIGHT") }}</div>
  <div class="slide-counter">[{{ slide_number }}/{{ total_slides }}]</div>

  <div class="content">
    <h1 class="headline">{{ slide_headline }}</h1>
    <div class="heavy-rule"></div>

    {% if slide_body %}
    <p class="body-text">{{ slide_body }}</p>
    {% endif %}

    {% if slide_number == total_slides and cta_text %}
    <div class="cta-brutalist">{{ cta_text | default("FOLLOW") }}</div>
    {% endif %}
  </div>

  <div class="footer">
    <span class="footer-bar"></span>
    <span>{{ handle | default("@ahmad") }}</span>
  </div>
</body>
</html>
