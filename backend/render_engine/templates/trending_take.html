<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px; height: 1080px;
    font-family: 'Inter', sans-serif;
    position: relative;
    overflow: hidden;
    background-color: #0f172a; /* Fallback dark */
  }

  /* Full Bleed Background Image */
  .hero-bg {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }

  /* Heavy dark gradient overlay for text readability */
  .overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(15, 23, 42, 0.95) 0%, rgba(15, 23, 42, 0.7) 50%, rgba(15, 23, 42, 0.3) 100%);
    z-index: 1;
  }

  .content {
    position: absolute;
    z-index: 2;
    bottom: 80px;
    left: 80px;
    right: 80px;
    color: #ffffff;
  }

  .tag {
    display: inline-block;
    padding: 10px 20px;
    background: #e11d48; /* Accent red */
    color: white;
    font-weight: 700;
    font-size: 24px;
    text-transform: uppercase;
    border-radius: 4px;
    margin-bottom: 24px;
    font-family: 'Outfit', sans-serif;
  }

  .headline {
    font-family: 'Outfit', sans-serif;
    font-size: 72px;
    font-weight: 800;
    line-height: 1.1;
    margin-bottom: 32px;
    letter-spacing: -0.02em;
  }

  .body-text {
    font-size: 32px;
    line-height: 1.5;
    font-weight: 400;
    color: #cbd5e1;
  }

  /* Watermark / Brand */
  .brand {
    position: absolute;
    top: 60px;
    left: 60px;
    z-index: 2;
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .brand-logo {
    width: 48px; height: 48px;
    border-radius: 50%;
    background: #e11d48;
  }
  .brand-text {
    color: white;
    font-size: 24px;
    font-weight: 600;
    font-family: 'Outfit', sans-serif;
  }
</style>
</head>
<body>
  {% if hero_image_url %}
  <img src="{{ hero_image_url }}" class="hero-bg" />
  {% endif %}
  <div class="overlay"></div>

  <div class="brand">
    <div class="brand-logo"></div>
    <div class="brand-text">@ahmad_builds</div>
  </div>

  <div class="content">
    <div class="tag">HOT TAKE</div>
    <h1 class="headline">{{ slide_headline }}</h1>
    {% if slide_body %}
    <p class="body-text">{{ slide_body }}</p>
    {% endif %}
  </div>
</body>
</html>
