[phases.setup]
nixPkgs = [
  "nodejs_20",
  "chromium",
  "nss",
  "nspr",
  "atk",
  "cups",
  "libdrm",
  "dbus",
  "xorg.libX11",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "mesa",
  "expat",
  "xorg.libxcb",
  "libxkbcommon",
  "pango",
  "cairo",
  "alsa-lib",
  "ffmpeg"
]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "playwright install chromium --with-deps",
  "cd backend/render_engine/templates/video && npm install"
]

[start]
cmd = "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
